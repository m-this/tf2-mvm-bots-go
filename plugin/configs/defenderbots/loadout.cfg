// What the bots carry, when sm_redbots_manager_use_custom_loadouts is 1.
//
// Every index below was read out of the game's own scripts/items/items_game.txt,
// not from memory. -1 is the stock weapon for that slot.
//
// A "seats" block can name one bot instead of a whole class. A seat is a position in
// sm_redbots_manager_team_composition, counted from 1, and it names the class it was
// written for so it goes ignored when somebody else ends up sitting there:
//
//	"seats"
//	{
//		"1"	{ "class" "engineer"	"secondary" "140" }
//		"2"	{ "class" "engineer"	"primary" "997" }
//	}
//
// A seat that matches decides every slot, so a slot it leaves out is the stock weapon
// rather than the class block's answer. Everything below is what a bot in no named seat
// carries, which is still most of them.
//
// Two rules decided most of this. A weapon the bot code does not know how to play
// is worse than the stock one it does: the sticky launcher behaviour is written for
// the stock launcher, so the Demoman keeps it (TODO item 6). And a weapon whose
// downside needs a human to manage it is not worth its upside to a bot: no Gloves
// of Running Urgently, whose health drain nobody here watches.
"loadout"
{
	"scout"
	{
		// Shortstop reloads as one clip, which suits a bot that fires until empty.
		// Mad Milk is the slow the wiki asks for on Giant Scout waves, and the Fan
		// O'War mark is a team-wide damage bonus on whatever the Scout hits.
		"primary"	"220"
		"secondary"	"222"
		"melee"		"355"
	}
	"soldier"
	{
		// The stock rocket launcher, because a bot cannot aim off a spread.
		//
		// This was the Beggar's Bazooka, which is the wiki's answer for tanks and
		// single giants and a fine choice for a person: you load three, release, and
		// walk the spread onto the target. A bot aims at a point and eats every
		// deviation. Measured over ten waves on Decoy and Bigrock, stock against the
		// Beggar's: 61% of rockets hit against 46%, 22% more damage in total, and
		// roughly a third less damage into himself.
		//
		// The Buff Banner stays. It pays for itself once the team stands together,
		// which is what the dispenser guarding makes them do.
		"primary"	"-1"
		"secondary"	"129"
		"melee"		"775"
	}
	"pyro"
	{
		// Phlogistinator: the crit burst is the tank damage, and Mmmph is charged by
		// the flame damage a Pyro does anyway.
		//
		// It costs the airblast, which is the one thing to weigh: no bomb reset, no
		// reflect, no pushing a buster away. The bots do not reset bombs and the
		// engineer hauls its own sentry clear of busters, so what is lost is the
		// rocket reflect. Worth measuring rather than assuming.
		//
		// Not the Gas Passer, which the wiki does recommend: it crashes the server.
		// A Pyro holding one trips the watchdog at a wave transition, four runs in
		// six, and a shotgun in that slot is clean six waves running. The cause is
		// in this mod, not the loadout: EquipBestWeaponForThreat says "always throw
		// gas" whenever HasAmmo is true, and HasAmmo on a charge-meter weapon is
		// always true, so the Pyro equips a jar it cannot throw and never stops.
		// TODO item 12. The shotgun until that is fixed.
		"primary"	"594"
		"secondary"	"199"
		"melee"		"214"
	}
	"demoman"
	{
		// Iron Bomber's pipes do not roll away, which is worth more to a bot that
		// cannot lead a bounce. Stock stickies, because that is what stickytrap.sp
		// knows how to lay and detonate.
		"primary"	"1151"
		"secondary"	"-1"
		"melee"		"-1"
	}
	"heavyweapons"
	{
		// Stock minigun. The bot code checks for TF_WEAPON_MINIGUN and the damage is
		// what body-blocking a giant is worth. The shotgun is for the walk between
		// positions, when the minigun is spun down.
		"primary"	"-1"
		"secondary"	"199"
		"melee"		"-1"
	}
	"engineer"
	{
		// Wrangler, because the engineer behaviour already pulls it out for the
		// shield when the sentry is under fire. The Jag builds faster, which matters
		// every time the nest moves or a buster takes the sentry.
		"primary"	"-1"
		"secondary"	"140"
		"melee"		"329"
	}
	"sniper"
	{
		// No composition seats a Sniper yet, so this is here for a lineup that draws
		// one rather than for anything the shipped maps do.
		//
		// Hitman's Heatmaker: the focus meter keeps him scoped after a shot, so he does
		// not have to find the next robot from scratch every time, which is the part of
		// sniping a bot is worst at. Jarate marks what he cannot headshot for the whole
		// team. Bushwacka turns those minicrits into a melee that finishes a giant.
		"primary"	"752"
		"secondary"	"58"
		"melee"		"232"
	}
	"spy"
	{
		// Also unseated by any composition, and the same reason for being here.
		//
		// L'Etranger returns cloak on a hit, which is what keeps the Dead Ringer up, and
		// the Dead Ringer is what keeps a Spy alive long enough to reach a second
		// backstab. The Kunai takes his health to 210 off a lethal stab, which is the
		// difference between one backstab and a run of them.
		"primary"	"224"
		"secondary"	"59"
		"melee"		"356"
	}
	"medic"
	{
		// Stock medigun. The uber is what stops a giant, and medic_uber.sp deploys by
		// medigun type. The Ubersaw builds that uber back out of anything it hits,
		// including a sentry buster.
		"primary"	"-1"
		"secondary"	"-1"
		"melee"		"37"
	}
}
