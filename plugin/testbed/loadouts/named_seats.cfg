// Two seats given names, for the seat-naming path in SetRandomNameOnBot.
//
// A bot in a named seat is called what the seat says instead of drawing from
// bot_names.txt, and keeps it: people get attached to a team, and a name that
// changed every wave was not one of theirs. Seat 3 is deliberately left unnamed,
// because the draw has to keep working beside the pins.
//
//   TESTBED_LOADOUT=testbed/loadouts/named_seats.cfg go run ./cmd/testbed -map mvm_decoy
//
"loadout"
{
	"seats"
	{
		"1"
		{
			"class"	"scout"
			"name"	"Gravel Pit Gary"
		}
		"2"
		{
			"class"	"soldier"
			"name"	"Sergeant Crumbs"
		}
	}
}
